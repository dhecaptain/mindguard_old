services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        HF_TOKEN: ${HF_TOKEN:-}
    env_file:
      - .env
    environment:
      - MINDGUARD_DB_DIR=/app/data
      - PORT=${BACKEND_PORT:-8000}
      - API_PORT=${BACKEND_PORT:-8000}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:5188,http://localhost:3000}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:5173}
      - MINDGUARD_ENV=${MINDGUARD_ENV:-development}
    volumes:
      - mindguard_data:/app/data
      - backend_cache:/root/.cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx; httpx.get('http://localhost:8000/api/v1/healthz', timeout=5).raise_for_status()\""]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mindguard_data:
  backend_cache:
