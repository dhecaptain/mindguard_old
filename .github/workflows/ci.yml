name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Frontend and backend quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            marketing/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend typecheck and build
        working-directory: frontend
        run: npm run build
      - name: Install marketing dependencies
        working-directory: marketing
        run: npm ci
      - name: Marketing lint
        working-directory: marketing
        run: npx next lint .
      - name: Marketing production build
        working-directory: marketing
        run: npm run build
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-test.txt
      - name: Ruff lint
        run: ruff check backend

  unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - name: Install test deps
        run: pip install -r requirements-test.txt
      - name: Run pytest
        run: pytest -q
        env:
          JWT_SECRET: ci-jwt-secret
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
          ENCRYPTION_KEY: c8d90a2f19b4c65e7a3b5d8f0123456789abcdef0123456789abcdef01234567
          ENFORCE_CONSENT_ANALYSIS: 'true'

  e2e:
    name: Playwright e2e (frontend + marketing + API)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install torch (CPU-only, avoids multi-GB CUDA wheels)
        run: pip install 'torch>=2.5' --index-url https://download.pytorch.org/whl/cpu

      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Install Playwright (frontend)
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Install marketing deps
        working-directory: marketing
        run: npm ci

      - name: Run Playwright e2e
        working-directory: frontend
        run: npx playwright test
        env:
          JWT_SECRET: e2e-jwt-secret-do-not-use-in-prod
          ENCRYPTION_KEY: eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
          ENFORCE_CONSENT_ANALYSIS: 'true'

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
